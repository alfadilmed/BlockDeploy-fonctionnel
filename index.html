  <style>
    body {
      font-family: 'Inter', sans-serif; /* Ensure Inter or a similar font is loaded or available */

    /* Custom scrollbar for a more modern look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1A1C2D; /* brand-secondary */
    }
    ::-webkit-scrollbar-thumb {
      background: #3A3C5A; /* A muted accent */

    }

      background: #00A8FF; /* brand-accent-blue */
    }

    /* GlowButton Animations */
    @keyframes subtle-glow-blue-animation {
      0%, 100% { box-shadow: 0 0 12px 3px rgba(0, 168, 255, 0.35), 0 0 6px 1px rgba(0, 168, 255, 0.25); }

    }

      50% { box-shadow: 0 0 20px 7px rgba(160, 32, 240, 0.55), 0 0 12px 3px rgba(160, 32, 240, 0.45); }
    }
    .animate-glow-blue {
      animation: subtle-glow-blue-animation 2.5s ease-in-out infinite;
    }
    .animate-glow-purple {
      animation: subtle-glow-purple-animation 2.5s ease-in-out infinite;
    }
  </style>
